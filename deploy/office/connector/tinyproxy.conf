# Outbound filter for the library connector: library-php may reach only these hosts, over HTTPS.
User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Timeout 120
# A log file, not syslog: Ubuntu's AppArmor profile for tinyproxy allows this path.
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Notice
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 50
Allow 127.0.0.1
DisableViaHeader Yes
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterDefaultDeny Yes
ConnectPort 443
