# The library connector, reached only through the Cloudflare tunnel (cloudflared -> 127.0.0.1:8080).
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    root /srv/library/live/app/www;
    server_tokens off;
    access_log off;
    client_max_body_size 128k;
    client_body_buffer_size 128k;

    location / {
        include fastcgi_params;
        # $realpath_root: the release folder the "app" link points to right now, so a new release takes
        # effect at once (PHP's caches key on the real path; with the link path they keep the old code).
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/library-php/php.sock;
        fastcgi_read_timeout 80s;
        fastcgi_buffering off;
    }
}
