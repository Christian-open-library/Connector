# library-setup: the deploy account's key lives in a root-owned file and always runs the deploy
# command, whatever the account itself can write.
Match User libdeploy
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    ForceCommand /usr/local/sbin/library-deploy-shell
    PermitTTY no
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
Match all
