; PHP-FPM for the library connector (office server). Runs entirely as libsrv under library-php.service.
[global]
pid = /run/library-php/php-fpm.pid
error_log = syslog
syslog.ident = library-php
daemonize = no

[library]
listen = /run/library-php/php.sock
; The directory (/run/library-php, group www-data, 0750) limits who can reach the socket: libsrv and nginx.
listen.mode = 0666
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
request_terminate_timeout = 75s
security.limit_extensions = .php
clear_env = yes
env[LIBRARY_CONFIG] = /srv/library/config/config.php
; Voyage is reached only through the local filtering proxy (library-php can reach nothing but localhost).
env[https_proxy] = http://127.0.0.1:8888
env[HTTPS_PROXY] = http://127.0.0.1:8888
env[no_proxy] = 127.0.0.1,localhost
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = syslog
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 60
php_admin_value[open_basedir] = /srv/library/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_flag[allow_url_include] = off
php_admin_flag[expose_php] = off
; MemoryDenyWriteExecute in the service: no JIT anywhere.
php_admin_value[pcre.jit] = 0
php_admin_value[opcache.jit] = disable
php_admin_value[opcache.jit_buffer_size] = 0
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 2
php_admin_value[realpath_cache_ttl] = 2
